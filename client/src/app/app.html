@if(identity){
  <div class="container">
    <div class="navigation">
      <div class="col-lg-1">
        <h1>{{title}}</h1>
      </div>
    </div>

    <div class="row justify-content-center">
      <div class="col-lg-11">
        <p>Estas logueado en la aplicación</p>
      </div>
    </div>
  </div>

}@else{
  <div class="container">
    <div class="row align-items-start">

      <div class="col-lg-6">
        <h1>Identificate</h1>
        <form #loginForm="ngForm" (ngSubmit)="onSubmit()" class="col-md-7">
          <p>
            <label>Correo electrónico:</label>
            <input type="email" #email="ngModel" name="email" [(ngModel)]="user.email" class="form-control" required />
            @if(!email.valid && email.touched){
              <span>El email es obligatorio</span>
            }
          </p>

          <p>
            <label>Contraseña:</label>
            <input type="password" #password="ngModel" name="password" [(ngModel)]="user.password"  class="form-control" required />
          </p>

          <input type="submit" value="Entrar" class="form-control" required />
        </form>
      </div>

      <div class="col-lg-6">
        <h1>Registrate</h1>
        <form class="col-md-7">
          <p>
            <label>Nombre:</label>
            <input type="text" class="form-control" required />
          </p>

          <p>
            <label>Apellidos:</label>
            <input type="text" class="form-control" required />
          </p>

          <p>
            <label>Correo electrónico:</label>
            <input type="text" class="form-control" required />
          </p>

          <p>
            <label>Contraseña:</label>
            <input type="password" class="form-control" required />
          </p>

          <input type="submit" value="Registrar" class="form-control" required />
        </form>
      </div>

    </div>
  </div>

}

<router-outlet />
